services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: busca_hibrida
      POSTGRES_USER: busca_hibrida
      POSTGRES_PASSWORD: busca_hibrida
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U busca_hibrida -d busca_hibrida"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/busca_hibrida
      SPRING_DATASOURCE_USERNAME: busca_hibrida
      SPRING_DATASOURCE_PASSWORD: busca_hibrida
    volumes:
      - model-cache:/app/.cache

volumes:
  postgres-data:
  model-cache:
