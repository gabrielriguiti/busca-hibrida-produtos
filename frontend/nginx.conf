server {
    listen 80;
    server_name _;

    # resolver do Docker + hostname em variavel: resolve "app" em tempo de requisicao,
    # nao no boot do nginx - senao o container inteiro falha ao subir se o backend
    # ainda nao estiver na rede. $request_uri repassa o path+query originais - com
    # variavel no proxy_pass, o nginx nao faz mais a reescrita automatica de prefixo.
    resolver 127.0.0.11 valid=10s;
    set $backend app:8080;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
